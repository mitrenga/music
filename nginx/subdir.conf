# nginx – several applications in subdirectories of one web root
# (https://media.example.com/music/, /gallery/, /photos/ …)
#
#   /var/www/media/music/     this project          -> https://media.example.com/music/
#   /var/www/media/gallery/   gallery project       -> https://media.example.com/gallery/
#
# Each application protects its own static files with auth_request against its
# own auth.php – copy the "music" block for every further instance and change
# the directory name (the first URL segment) in the three places marked (*).
#
# Install:  sudo cp nginx/subdir.conf /etc/nginx/sites-available/media.example.com
#           sudo ln -s ../sites-available/media.example.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Then run ./check.sh https://media.example.com/music user password.

server {
	listen 80;
	listen [::]:80;
	server_name media.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name media.example.com;

	root /var/www/media;
	index index.php;

	ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header Strict-Transport-Security "max-age=63072000" always;

	# ---- never serve: passwords, git, scripts, docs, dot files (all applications) ----
	location ~ /config\.json$ { deny all; }
	location ~ /\.(?:git|ht) { deny all; }
	location ~* \.(?:sh|sql|log|sample|md)$ { return 404; }

	# ================= music  (/music/) =================
	# audio (cd/flac/…) and cover thumbnails
	location ~ ^/music/(?:cd|covers)/ {                       # (*)
		auth_request /auth-check-music;
	}
	# prepared album downloads tmp/<user>/*.zip – auth.php lets only the owner in
	location ~ ^/music/tmp/ {                                 # (*)
		auth_request /auth-check-music;
		add_header Content-Disposition attachment;
	}
	location = /auth-check-music {
		internal;
		include fastcgi_params;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root/music/auth.php;   # (*)
		fastcgi_param X_ORIGINAL_URI $request_uri;
		fastcgi_pass_request_body off;
		fastcgi_param CONTENT_LENGTH "";
	}

	# ================= gallery  (/gallery/) =================
	# photos and thumbnails – see nginx/subdir.conf in the gallery project
	location ~ ^/gallery/(?:gallery|thumbs)/ {
		auth_request /auth-check-gallery;
	}
	location = /auth-check-gallery {
		internal;
		include fastcgi_params;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root/gallery/auth.php;
		fastcgi_pass_request_body off;
		fastcgi_param CONTENT_LENGTH "";
	}

	# ---- PWA: manifest mime type ----
	location ~ \.webmanifest$ { default_type application/manifest+json; }

	# ---- the applications (SPA – /app/anything -> /app/index.php?anything) ----
	location / {
		try_files $uri $uri/ @rewrite;
		error_page 404 = @rewrite;
	}
	location @rewrite {
		rewrite ^/([^/]+)/(.*)$ /$1/index.php?$2 last;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_read_timeout 300;
	}

	# cover upload (see README) – raise together with PHP upload_max_filesize/post_max_size
	client_max_body_size 25m;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
