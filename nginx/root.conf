# nginx – the music archive alone in the web root (https://music.example.com/)
#
#   /var/www/music/          this project (index.php, getData.php, auth.php, cd/, covers/, tmp/ …)
#
# Install:  sudo cp nginx/root.conf /etc/nginx/sites-available/music.example.com
#           sudo ln -s ../sites-available/music.example.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Adjust server_name, root, the certificate paths and the php-fpm socket.
# Then run ./check.sh https://music.example.com user password.

server {
	listen 80;
	listen [::]:80;
	server_name music.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name music.example.com;

	root /var/www/music;
	index index.php;

	ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	add_header Strict-Transport-Security "max-age=63072000" always;

	# ---- never serve: passwords, git, scripts, docs, dot files ----
	location ~ /config\.json$ { deny all; }
	location ~ /\.(?:git|ht) { deny all; }
	location ~* \.(?:sh|sql|log|sample|md)$ { return 404; }

	# ---- static music files only for signed-in users (auth_request -> auth.php) ----
	# audio (cd/flac/…) and cover thumbnails
	location ~ ^/(?:cd|covers)/ {
		auth_request /auth-check;
	}
	# prepared album downloads tmp/<user>/*.zip – auth.php lets only the owner in
	# (it gets the requested URL in X_ORIGINAL_URI)
	location ~ ^/tmp/ {
		auth_request /auth-check;
		add_header Content-Disposition attachment;
	}
	location = /auth-check {
		internal;
		include fastcgi_params;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root/auth.php;
		fastcgi_param X_ORIGINAL_URI $request_uri;
		fastcgi_pass_request_body off;
		fastcgi_param CONTENT_LENGTH "";
	}

	# ---- the application (SPA – everything unknown goes to index.php) ----
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass unix:/run/php/php-fpm.sock;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
		fastcgi_read_timeout 300;
	}

	# cover upload (see README) – raise together with PHP upload_max_filesize/post_max_size
	client_max_body_size 25m;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
